<style>
:root{
  --violet:#3B2366; --violet-2:#5B3F8C; --mist:#EEE8F6; --mist-2:#F6F2FB; --ivory:#FCFAF6;
  --gold:#B8903F; --gold-soft:#F3EAD7; --ink:#2A2233; --muted:#6D6478; --line:#E2DAEC;
  --rose:#B5536B; --rose-soft:#F8E3E8; --sage:#5F7F5B; --sage-soft:#E4EEE1; --sky:#4F7CAC; --sky-soft:#E1EBF5;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Figtree",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:15px/1.5 var(--sans);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--violet-2)}
h1,h2,h3{font-family:var(--serif);color:var(--violet);font-weight:600;margin:0}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 28px;text-align:center}
.login-box img{width:72px;height:72px;border-radius:50%}
.login-box h1{font-size:2rem;margin:12px 0 4px}
.login-box p{color:var(--muted);margin:0 0 22px}
.login-box .fld{text-align:left}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--violet);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{width:36px;height:36px;border-radius:50%;background:#fff}
.brand b{font:600 1.35rem var(--serif);letter-spacing:.2px}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;color:#E6DCF5;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500}
.nav button.on{background:rgba(255,255,255,.14);color:#fff}
.nav button:focus-visible{outline:2px solid var(--gold)}
.top .out{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
.page-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:2.1rem;margin-right:auto}

/* ---------- controls ---------- */
.btn{border:1px solid transparent;border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn-p{background:var(--violet);color:#fff}.btn-p:hover{background:var(--violet-2)}
.btn-g{background:var(--gold);color:#fff}
.btn-o{background:#fff;border-color:var(--line)}
.btn-wa{background:#25D366;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-sm{padding:6px 12px;font-size:.86rem}
.btn-danger{background:none;border:0;color:var(--rose);cursor:pointer;font-weight:500;padding:6px}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:500;font-size:.9rem;margin-bottom:5px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=password],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet-2);box-shadow:0 0 0 3px rgba(91,63,140,.14)}
textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input[type=search]{max-width:280px}
.filters select{width:auto}

/* ---------- overview ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:18px;background:#fff;margin-bottom:26px;overflow:hidden}
.stat{padding:18px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font:600 2.2rem/1 var(--serif);color:var(--violet)}
.stat span{color:var(--muted);font-size:.88rem}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.panel h2{font-size:1.45rem;margin-bottom:10px}
.empty{color:var(--muted);padding:18px 0;text-align:center}

/* ---------- lists / tables ---------- */
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:18px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-weight:600;font-size:.82rem;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--mist-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FDFBFF}
.link{background:none;border:0;padding:0;color:var(--violet);font-weight:600;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.av{width:38px;height:38px;border-radius:50%;background:var(--mist) center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;font:600 1rem var(--serif);color:var(--violet-2);flex-shrink:0}
.who{display:flex;align-items:center;gap:10px}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--violet-2)}
.tag.new{background:var(--gold-soft);color:#8a6a2a}
.st{font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;border:0}
.st-Pending{background:var(--gold-soft);color:#7d5e1f}
.st-Complete{background:var(--sage-soft);color:#3d5a39}
.st-Cancelled{background:var(--rose-soft);color:#8b3348}
.st-Active{background:var(--sage-soft);color:#3d5a39}
.st-Inactive{background:#EEE;color:#666}
select.st{padding:4px 8px;width:auto;cursor:pointer}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:0}
.row-item .grow{flex:1;min-width:0}
.row-item small{color:var(--muted);display:block}
.day-h{font:600 1rem var(--sans);color:var(--muted);margin:14px 0 2px}

/* ---------- patient page ---------- */
.back{background:none;border:0;color:var(--violet-2);cursor:pointer;padding:0;margin-bottom:14px;font-weight:500}
.p-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.p-photo{width:96px;height:96px;border-radius:20px;background:var(--mist) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:600 2.2rem var(--serif);color:var(--violet-2);flex-shrink:0;cursor:zoom-in}
.p-info{flex:1;min-width:220px}
.p-info h1{font-size:2rem}
.p-info .meta{color:var(--muted)}
.p-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.p-ctl select{width:auto}
.tabs{display:flex;gap:4px;margin:22px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--violet);border-bottom-color:var(--gold)}
.dl{display:grid;grid-template-columns:200px 1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.dl dt,.dl dd{padding:12px 16px;margin:0;border-bottom:1px solid var(--line)}
.dl dt{color:var(--muted);font-size:.9rem;background:var(--mist-2)}
.dl dd{white-space:pre-wrap}
@media (max-width:640px){.dl{grid-template-columns:1fr}.dl dt{border-bottom:0;padding-bottom:2px}}
.symlist{display:flex;flex-direction:column;gap:8px}
.symrow{display:flex;align-items:center;gap:10px}
.bar{flex:0 0 140px;height:8px;border-radius:8px;background:var(--mist);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
@media (max-width:640px){.symrow{flex-wrap:wrap;gap:4px 10px}.bar{flex-basis:90px}
  .top-in{gap:10px}.brand{order:1}.top .out{order:2;padding:6px 12px}.nav{order:3;width:100%}.nav button{flex:1}}

/* scan cards */
.scan-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.scan-card .grow{flex:1}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0}
.e-Congested,.a-Over{background:var(--rose-soft);color:#8b3348}
.e-Normal,.a-Normal{background:var(--sage-soft);color:#3d5a39}
.e-Depleted,.a-Under{background:var(--sky-soft);color:#2f5680}

/* progress heatmap */
.heat{border-collapse:separate;border-spacing:0;min-width:auto}
.heat th,.heat td{padding:6px 8px;border-bottom:1px solid var(--line);font-size:.82rem;text-align:center;white-space:nowrap}
.heat th:first-child,.heat td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:500}
.heat .cell{display:flex;flex-direction:column;gap:3px;align-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:10px 0 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.chart-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px;height:300px}

/* fees */
.fee-sum{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden}
.fee-sum div{padding:16px 18px;border-right:1px solid var(--line)}
.fee-sum div:last-child{border-right:0}
.fee-sum b{display:block;font:600 1.8rem var(--serif);color:var(--violet)}
.fee-sum span{font-size:.86rem;color:var(--muted)}
.fee-sum .due b{color:var(--rose)}

/* ---------- modal ---------- */
dialog{border:0;border-radius:22px;padding:0;width:min(760px,96vw);max-height:92vh;background:var(--ivory);color:var(--ink)}
dialog::backdrop{background:rgba(35,20,60,.45)}
.m-h{position:sticky;top:0;z-index:2;background:var(--ivory);display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.m-h h2{font-size:1.6rem;margin-right:auto}
.m-x{background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--muted);line-height:1}
.m-b{padding:20px 22px}
.m-f{position:sticky;bottom:0;background:var(--ivory);display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.sec-t{font:600 1.25rem var(--serif);color:var(--violet);margin:18px 0 10px}
.chak{display:grid;grid-template-columns:120px 1fr 1fr;gap:10px;align-items:start;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.chak b{padding-top:9px;font-weight:600}
.chak .obs{margin-top:6px}
.chak select{padding:8px 10px}
@media (max-width:640px){.chak{grid-template-columns:1fr}.chak b{padding-top:0}}
.dyn{display:grid;gap:8px;align-items:start;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.dyn-minor{grid-template-columns:1fr 1fr 1fr auto}
.dyn-organ{grid-template-columns:1fr 1fr 1.4fr auto}
.dyn-emo{grid-template-columns:1fr 2fr auto}
@media (max-width:640px){.dyn-minor,.dyn-organ,.dyn-emo{grid-template-columns:1fr}}
.add{background:none;border:1px dashed var(--gold);color:#8a6a2a;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.days{display:flex;flex-wrap:wrap;gap:8px}
.days label{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:999px;cursor:pointer}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;cursor:pointer}
.preview{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:.88rem;color:#5a4a2a}
.view-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.view-block small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:100;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.err-box{background:var(--rose-soft);color:#7a2c3f;padding:10px 12px;border-radius:10px;margin-top:10px;font-size:.9rem}
.photo-big{max-width:100%;max-height:80vh;display:block;margin:0 auto;border-radius:12px}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
/* =====================================================================
   CONFIG & CONSTANTS
   ===================================================================== */
const C = window.PRANA_CONFIG || {};
const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const MAJOR = ["Crown","Forehead","Ajna","Throat","Front Heart","Back Heart","Front Solar","Back Solar","Front Spleen","Back Spleen","Navel","Meng Mein","Sex","Basic"];
const ENERGY = ["Congested","Normal","Depleted"];
const ACTIV  = ["Over Activated","Normal","Under Activated"];
const UNITS  = ["Inches","Centimeters","Feet","Meters"];
const TO_IN  = {Inches:1, Centimeters:1/2.54, Feet:12, Meters:39.3701};
const CATEGORIES = ["Normal","ACPH","CPH","CPP"];
const HSTATUS = ["Pending","Complete","Cancelled"];
const PAYMODES = ["UPI","Cash","Bank transfer","Card","Other"];
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const S = { patients:[], healings:[], payments:[], photos:{}, current:null, tab:'profile', view:'home', chart:null };

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const iso = d => { const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const addDays = (s,n) => { const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const fmtDate = s => s ? new Date(s.length>10?s:s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—';
const fmtDay = s => new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
const fmtTime = t => { if(!t) return '—'; const [h,m]=t.split(':'); const d=new Date(); d.setHours(+h,+m); return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}); };
const money = n => '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const age = dob => { if(!dob) return '—'; const b=new Date(dob+'T00:00:00'), n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate())) a--; return a; };
const initials = n => (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const waNum = p => { let d=String(p||'').replace(/\D/g,''); if(d.length===10) d='91'+d; if(d.length===11 && d.startsWith('0')) d='91'+d.slice(1); return d; };
const waLink = (p,msg='') => `https://wa.me/${waNum(p)}${msg?`?text=${encodeURIComponent(msg)}`:''}`;
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
const pById = id => S.patients.find(p=>p.id===id);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function fail(e){ console.error(e); toast(e?.message ? `Couldn't save: ${e.message}` : "Couldn't save. Check your connection."); }
const opts = (arr, sel, blank) => (blank!==undefined?`<option value="">${esc(blank)}</option>`:'') + arr.map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');
const avatar = (p,cls='av') => { const u=S.photos[p.id]; return `<span class="${cls}" style="${u?`background-image:url('${u}')`:''}">${u?'':esc(initials(p.full_name))}</span>`; };

/* =====================================================================
   AUTH
   ===================================================================== */
async function boot(){
  if(!C.SUPABASE_URL || C.SUPABASE_URL.startsWith('PASTE')){
    document.body.innerHTML = '<p style="padding:40px;text-align:center">Add your Supabase URL and key to <b>config.js</b> to use the dashboard.</p>'; return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  session ? enter() : showLogin();
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT') showLogin(); });
}
function showLogin(){ $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#lemail').focus(); }
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); const b=$('#lbtn'); b.disabled=true; b.textContent='Signing in…'; $('#lerr').classList.add('hidden');
  const { error } = await sb.auth.signInWithPassword({ email:$('#lemail').value.trim(), password:$('#lpass').value });
  b.disabled=false; b.textContent='Sign in';
  if(error){ $('#lerr').textContent = error.message==='Invalid login credentials' ? 'That email and password don\'t match. Try again.' : error.message; $('#lerr').classList.remove('hidden'); return; }
  enter();
});
$('#logout').onclick = async ()=>{ await sb.auth.signOut(); showLogin(); };

async function enter(){
  const { data:isAdmin } = await sb.rpc('is_admin');
  if(!isAdmin){ await sb.auth.signOut(); showLogin(); $('#lerr').textContent='This email is not on the admin list yet. Add it in Supabase (see setup step).'; $('#lerr').classList.remove('hidden'); return; }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  const h=new Date().getHours(); $('#greet').textContent = (h<12?'Good morning':h<17?'Good afternoon':'Good evening') + ', Mamta';
  $('#pcat').innerHTML = opts(CATEGORIES, '', 'All categories');
  await loadAll();
  const hash = location.hash.slice(1);
  if(hash.startsWith('p/')) openPatient(hash.slice(2)); else go(['patients','healings'].includes(hash)?hash:'home');
}

/* =====================================================================
   DATA
   ===================================================================== */
async function loadAll(){
  const [p,h,pay] = await Promise.all([
    sb.from('patients').select('*').order('created_at',{ascending:false}),
    sb.from('healings').select('*').order('healing_date').order('healing_time',{nullsFirst:true}),
    sb.from('payments').select('*').order('paid_on',{ascending:false})
  ]);
  if(p.error){
    if(/permission|policy|row-level/i.test(p.error.message)) toast('This login is not on the admin list. Add the email in Supabase.');
    else fail(p.error);
  }
  S.patients = p.data||[]; S.healings = (h.data||[]).sort((a,b)=>(a.healing_date+(a.healing_time||'')).localeCompare(b.healing_date+(b.healing_time||''))) ; S.payments = pay.data||[];
  await loadPhotos();
}
async function loadPhotos(){
  const need = S.patients.filter(p=>p.photo_path && !S.photos[p.id]);
  if(!need.length) return;
  const { data } = await sb.storage.from('patient-photos').createSignedUrls(need.map(p=>p.photo_path), 60*60*6);
  (data||[]).forEach((r,i)=>{ if(r.signedUrl) S.photos[need[i].id]=r.signedUrl; });
}

/* =====================================================================
   NAVIGATION
   ===================================================================== */
function go(view){
  S.view=view;
  ['home','patients','healings','patient'].forEach(v=>$('#v-'+v).classList.toggle('hidden', v!==view));
  $$('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.view===view || (view==='patient'&&b.dataset.view==='patients')));
  if(view!=='patient') history.replaceState(null,'', view==='home'?location.pathname:'#'+view);
  ({home:renderHome, patients:renderPatients, healings:renderHealings})[view]?.();
  window.scrollTo(0,0);
}
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==='new-patient') patientModal();
  if(act==='new-healing') healingModal(S.view==='patient'?S.current:null);
  if(act==='open') openPatient(id);
});

/* =====================================================================
   OVERVIEW
   ===================================================================== */
function renderHome(){
  const t=todayISO(), wk=addDays(t,7), wkAgo=addDays(t,-7);
  const pend = S.healings.filter(h=>h.status==='Pending');
  $('#s-today').textContent = pend.filter(h=>h.healing_date===t).length;
  $('#s-week').textContent  = pend.filter(h=>h.healing_date>=t && h.healing_date<=wk).length;
  $('#s-active').textContent= S.patients.filter(p=>p.status==='Active').length;
  $('#s-new').textContent   = S.patients.filter(p=>p.source==='web_form' && p.created_at.slice(0,10)>=wkAgo).length;

  const up = pend.filter(h=>h.healing_date>=t && h.healing_date<=wk);
  const overdue = pend.filter(h=>h.healing_date<t);
  let html='';
  if(overdue.length) html += `<div class="day-h" style="color:var(--rose)">Past sessions still marked pending (${overdue.length})</div>` + overdue.slice(-5).map(healRow).join('');
  let last='';
  up.forEach(h=>{ if(h.healing_date!==last){ last=h.healing_date; html+=`<div class="day-h">${h.healing_date===t?'Today':fmtDay(h.healing_date)}</div>`; } html+=healRow(h); });
  $('#upcoming').innerHTML = html || '<div class="empty">No healings in the next 7 days.<br><button class="btn btn-o btn-sm" style="margin-top:10px" data-act="new-healing">Schedule one</button></div>';

  const rec = S.patients.filter(p=>p.source==='web_form').slice(0,8);
  $('#recent').innerHTML = rec.length ? rec.map(p=>`
    <div class="row-item">${avatar(p)}<div class="grow"><button class="link" data-act="open" data-id="${p.id}">${esc(p.full_name)}</button>
      <small>${esc((p.primary_concerns||[]).join(', ')||'—')} · ${fmtDate(p.created_at)}</small></div>
      ${p.created_at.slice(0,10)>=wkAgo?'<span class="tag new">New</span>':''}</div>`).join('')
    : '<div class="empty">No forms yet. Share the intake link with new patients.</div>';
  bindHealRows($('#upcoming'));
}
function healRow(h){
  const p=pById(h.patient_id); if(!p) return '';
  return `<div class="row-item">${avatar(p)}<div class="grow"><button class="link" data-act="open" data-id="${p.id}">${esc(p.full_name)}</button>
    <small>${fmtTime(h.healing_time)}${h.healing_date<todayISO()?' · '+fmtDate(h.healing_date):''}${h.notes?' · '+esc(h.notes):''}</small></div>
    <button class="btn btn-o btn-sm" data-done="${h.id}">Mark complete</button></div>`;
}
function bindHealRows(root){
  $$('[data-done]',root).forEach(b=>b.onclick=async()=>{ await setHealStatus(b.dataset.done,'Complete'); });
}
async function setHealStatus(id,status){
  const { error } = await sb.from('healings').update({status}).eq('id',id);
  if(error) return fail(error);
  const h=S.healings.find(x=>x.id===id); if(h) h.status=status;
  toast(`Marked ${status.toLowerCase()}`); refresh();
}
function refresh(){ if(S.view==='patient') renderPatient(); else go(S.view); }

async function openPatient(id){
  const p=pById(id); if(!p){ go('patients'); return; }
  if(S.current!==id) S.tab='profile'; S.current=id;
  history.replaceState(null,'','#p/'+id);
  ['home','patients','healings'].forEach(v=>$('#v-'+v).classList.add('hidden'));
  $('#v-patient').classList.remove('hidden'); S.view='patient';
  $$('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.view==='patients'));
  const { data, error } = await sb.from('scans').select('*').eq('patient_id',id).order('scan_date',{ascending:false});
  if(error) fail(error);
  p._scans = data||[];
  renderPatient(); window.scrollTo(0,0);
}

async function updatePatient(p,patch){

function viewPhoto(p){

      <div style="display:flex;justify-content:space-between;margin-top:10px">

        <button class="btn btn-p btn-sm" id="savenotes">Save notes</button></div>
    </div>`;
  $('#savenotes').onclick=()=>updatePatient(p,{admin_notes:$('#anotes').value});
  $('#pdel').onclick=async()=>{
    if(!confirm(`Delete ${p.full_name} and all their scans, healings and payments? This can't be undone.`)) return;
    if(p.photo_path) await sb.storage.from('patient-photos').remove([p.photo_path]);
    const { error } = await sb.from('patients').delete().eq('id',p.id);
    if(error) return fail(error);
    S.patients=S.patients.filter(x=>x.id!==p.id); S.healings=S.healings.filter(h=>h.patient_id!==p.id); S.payments=S.payments.filter(x=>x.patient_id!==p.id);

function scanSummary(sc){
  const vals=Object.values(sc.major_chakras||{});

  const ac=k=>vals.filter(v=>v.activation===k).length;
  return [['Congested',cnt('Congested'),'e-Congested'],['Depleted',cnt('Depleted'),'e-Depleted'],['Over activated',ac('Over Activated'),'a-Over'],['Under activated',ac('Under Activated'),'a-Under']]
    .filter(x=>x[1]).map(([l,n,c])=>`<span class="pill ${c}">${n} ${l.toLowerCase()}</span>`).join('') || '<span class="pill e-Normal">All recorded chakras normal</span>';
}

      {label:'Average aura (inches)',data:scans.map(s=>inch(s.avg_aura,s.aura_unit)),borderColor:'#5B3F8C',backgroundColor:'#5B3F8C',tension:.3,spanGaps:true,yAxisID:'y'},

    openModal('Record payment',`<div class="g3"><div class="fld"><label for="pa">Amount (₹)</label><input type="number" id="pa" min="1" step="1"></div>
      <div class="fld"><label for="pdt">Date</label><input type="date" id="pdt" value="${todayISO()}"></div>
      <div class="fld"><label for="pm">Mode</label><select id="pm">${opts(PAYMODES,'UPI')}</select></div></div>
      <div class="fld"><label for="pn">Note</label><input type="text" id="pn" placeholder="e.g. 5-session package"></div>`,
      `<button class="btn btn-o" value="cancel">Cancel</button><button class="btn btn-p" id="ok" value="">Save payment</button>`);
    $('#ok').onclick=async e=>{ e.preventDefault(); const amt=+$('#pa').value; if(!amt){ $('#pa').focus(); return; }
      const row={patient_id:p.id,amount:amt,paid_on:$('#pdt').value||todayISO(),mode:$('#pm').value,note:$('#pn').value.trim()||null};
      const { data, error } = await sb.from('payments').insert(row).select().single(); if(error) return fail(error);
      S.payments.unshift(data); closeModal(); toast('Payment saved'); renderPatient(); };
  };
  $$('[data-pd]').forEach(b=>b.onclick=async()=>{ if(!confirm('Delete this payment?')) return;
    const { error } = await sb.from('payments').delete().eq('id',b.dataset.pd); if(error) return fail(error);
    S.payments=S.payments.filter(x=>x.id!==b.dataset.pd); toast('Payment deleted'); renderPatient(); });
}

/* =====================================================================
   MODAL PLUMBING
   ===================================================================== */
function openModal(title, body, foot){
  $('#mtitle').innerHTML=title; $('#mbody').innerHTML=body; $('#mfoot').innerHTML=foot||'';
  const m=$('#modal'); if(!m.open) m.showModal(); $('#mbody').scrollTop=0; m.scrollTop=0;
}
function closeModal(){ $('#modal').close(); }
$('#mform').addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.tagName!=='TEXTAREA' && e.target.tagName!=='BUTTON') e.preventDefault(); });

/* ---- Add / edit patient ---- */
function symRowHTML(s={}){
  return `<div class="dyn dyn-organ sym"><input type="text" class="s-n" placeholder="Symptom" value="${esc(s.name||'')}" aria-label="Symptom">
    <select class="s-i" aria-label="Intensity">${Array.from({length:11},(_,i)=>`<option value="${i}" ${+(s.intensity??5)===i?'selected':''}>Intensity ${i}</option>`).join('')}</select>
    <input type="text" class="s-r" placeholder="Remarks" value="${esc(s.remarks||'')}" aria-label="Remarks"><button type="button" class="btn-danger rm">Remove</button></div>`;
}
function patientModal(p){
  const e = p||{};
  openModal(p?'Edit details':'Add patient', `
    <div class="g2"><div class="fld"><label for="f_name">Full name *</label><input type="text" id="f_name" value="${esc(e.full_name||'')}"></div>
      <div class="fld"><label for="f_wa">WhatsApp number *</label><input type="tel" id="f_wa" value="${esc(e.whatsapp||'')}"></div></div>
    <div class="g3"><div class="fld"><label for="f_em">Email</label><input type="email" id="f_em" value="${esc(e.email||'')}"></div>
      <div class="fld"><label for="f_dob">Date of birth</label><input type="date" id="f_dob" value="${esc(e.dob||'')}"></div>
      <div class="fld"><label for="f_g">Gender</label><select id="f_g">${opts(['Female','Male','Other','Prefer not to say'],e.gender,'Select')}</select></div></div>
    <div class="g2"><div class="fld"><label for="f_oc">Occupation</label><input type="text" id="f_oc" value="${esc(e.occupation||'')}"></div>
      <div class="fld"><label for="f_ad">City / address</label><input type="text" id="f_ad" value="${esc(e.address||'')}"></div></div>
    <div class="g3"><div class="fld"><label for="f_st">Status</label><select id="f_st">${opts(['Active','Inactive'],e.status||'Active')}</select></div>
      <div class="fld"><label for="f_cat">Category</label><select id="f_cat">${opts(CATEGORIES,e.category||'Normal')}</select></div>
      <div class="fld"><label for="f_fee">Case fees (₹)</label><input type="number" id="f_fee" min="0" value="${e.case_fees??''}"></div></div>
    <div class="fld"><label for="f_goal">What they want to heal, release or strengthen</label><textarea id="f_goal">${esc(e.heal_goal||'')}</textarea></div>
    <div class="fld"><label for="f_med">Medical history</label><textarea id="f_med">${esc(e.medical_history||'')}</textarea></div>
    <div class="sec-t">Symptoms</div><div id="f_syms">${(e.symptoms&&e.symptoms.length?e.symptoms:[{}]).map(symRowHTML).join('')}</div>
    <button type="button" class="add" id="f_addsym">+ Add symptom</button>
    <div class="sec-t">Photo</div>
    <input type="file" id="f_photo" accept="image/*"> ${e.photo_path?'<small style="color:var(--muted)">Choosing a new photo replaces the current one.</small>':''}
    <div class="err-box hidden" id="f_err"></div>`,
    `<button class="btn btn-o" value="cancel">Cancel</button><button class="btn btn-p" id="ok" value="">${p?'Save changes':'Add patient'}</button>`);
  const wire=()=>$$('#f_syms .rm').forEach(b=>b.onclick=()=>b.closest('.sym').remove());
  wire(); $('#f_addsym').onclick=()=>{ $('#f_syms').insertAdjacentHTML('beforeend',symRowHTML()); wire(); };
  $('#ok').onclick=async ev=>{
    ev.preventDefault();
    const name=$('#f_name').value.trim(), wa=$('#f_wa').value.trim();
    if(!name||!wa){ $('#f_err').textContent='Name and WhatsApp number are required.'; $('#f_err').classList.remove('hidden'); return; }
    const btn=$('#ok'); btn.disabled=true;
    const row={ full_name:name, whatsapp:wa, email:$('#f_em').value.trim()||null, dob:$('#f_dob').value||null, gender:$('#f_g').value||null,
      occupation:$('#f_oc').value.trim()||null, address:$('#f_ad').value.trim()||null, status:$('#f_st').value, category:$('#f_cat').value,
      case_fees:$('#f_fee').value===''?null:+$('#f_fee').value, heal_goal:$('#f_goal').value.trim()||null, medical_history:$('#f_med').value.trim()||null,
      symptoms:$$('#f_syms .sym').map(d=>({name:$('.s-n',d).value.trim(),intensity:+$('.s-i',d).value,remarks:$('.s-r',d).value.trim()})).filter(s=>s.name) };
    const id = p ? p.id : uuid();
    const file=$('#f_photo').files[0];
    if(file){
      const path=`${id}/${Date.now()}-${file.name.replace(/[^\w.]/g,'_')}`;
      const up=await sb.storage.from('patient-photos').upload(path,file,{upsert:false});
      if(up.error){ btn.disabled=false; return fail(up.error); }
      if(p?.photo_path) await sb.storage.from('patient-photos').remove([p.photo_path]);
      row.photo_path=path; delete S.photos[id];
    }
    let res;
    if(p) res = await sb.from('patients').update(row).eq('id',id).select().single();
    else  res = await sb.from('patients').insert({...row,id,source:'manual'}).select().single();
    btn.disabled=false;
    if(res.error) return fail(res.error);
    if(p){ Object.assign(p,res.data); } else { S.patients.unshift(res.data); }
    await loadPhotos(); closeModal(); toast(p?'Details saved':'Patient added');
    p ? renderPatient() : openPatient(id);
  };
}

/* ---- Schedule healing ---- */
function healingModal(patientId){
  openModal('Schedule healing', `
    <div class="g2"><div class="fld"><label for="h_p">Patient *</label><select id="h_p">${S.patients.filter(p=>p.status==='Active'||p.id===patientId).map(p=>`<option value="${p.id}" ${p.id===patientId?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select></div>
      <div class="g2"><div class="fld"><label for="h_d">Start date *</label><input type="date" id="h_d" value="${todayISO()}"></div>
        <div class="fld"><label for="h_t">Time</label><input type="time" id="h_t"></div></div></div>
    <div class="fld"><label>Repeat</label><div class="radios">
      ${[['none','Does not repeat'],['daily','Every day'],['weekly','Every week'],['custom','Custom days']].map(([v,l],i)=>`<label><input type="radio" name="rep" value="${v}" ${i?'':'checked'}> ${l}</label>`).join('')}</div></div>
    <div id="h_rep" class="hidden">
      <div class="fld"><label>Ends</label><div class="radios"><label><input type="radio" name="end" value="count" checked> After a number of sessions</label><label><input type="radio" name="end" value="date"> On a date</label></div></div>
      <div class="g2"><div class="fld" id="h_cw"><label for="h_c">Number of sessions</label><input type="number" id="h_c" min="1" max="100" value="7"></div>
        <div class="fld hidden" id="h_ew"><label for="h_e">End date</label><input type="date" id="h_e" value="${addDays(todayISO(),30)}"></div></div>
      <div class="fld hidden" id="h_dw"><label>On these days</label><div class="days">${WEEKDAYS.map((d,i)=>`<label><input type="checkbox" value="${i}" class="h_day"> ${d.slice(0,3)}</label>`).join('')}</div></div>
    </div>
    <div class="fld"><label for="h_n">Notes</label><textarea id="h_n" placeholder="e.g. Distance healing, focus on solar plexus"></textarea></div>
    <div class="preview" id="h_prev"></div>`,
    `<button class="btn btn-o" value="cancel">Cancel</button><button class="btn btn-p" id="ok" value="">Schedule</button>`);
  if(!S.patients.length){ $('#h_prev').textContent='Add a patient first.'; $('#ok').disabled=true; return; }
  const gen=()=>{
    const rep=$('input[name=rep]:checked').value, start=$('#h_d').value; if(!start) return [];
    if(rep==='none') return [start];
    const byCount=$('input[name=end]:checked').value==='count', n=Math.min(+$('#h_c').value||1,100), end=$('#h_e').value;
    const days=$$('.h_day:checked').map(c=>+c.value), step=rep==='weekly'?7:1, out=[];
    for(let d=start, i=0; i<800 && out.length<100; i++, d=addDays(d,step)){
      if(!byCount && (!end || d>end)) break;
      if(rep==='custom' && !days.includes(new Date(d+'T00:00:00').getDay())) continue;
      out.push(d);
      if(byCount && out.length>=n) break;
    }
    return out;
  };
  const upd=()=>{
    const rep=$('input[name=rep]:checked').value;
    $('#h_rep').classList.toggle('hidden',rep==='none');
    $('#h_dw').classList.toggle('hidden',rep!=='custom');
    const byCount=$('input[name=end]:checked').value==='count';
    $('#h_cw').classList.toggle('hidden',!byCount); $('#h_ew').classList.toggle('hidden',byCount);
    const ds=gen();
    $('#h_prev').innerHTML = ds.length ? `${ds.length} session${ds.length>1?'s':''}: ${ds.slice(0,6).map(fmtDate).join(', ')}${ds.length>6?` … last on ${fmtDate(ds[ds.length-1])}`:''}` : (rep==='custom'?'Pick at least one day.':'Choose a start date.');
  };
  $('#mbody').addEventListener('input',upd); $('#mbody').addEventListener('change',upd); upd();
  $('#ok').onclick=async ev=>{
    ev.preventDefault(); const ds=gen(); if(!ds.length) return;
    const series = ds.length>1 ? uuid() : null;
    const rows = ds.map(d=>({patient_id:$('#h_p').value, healing_date:d, healing_time:$('#h_t').value||null, notes:$('#h_n').value.trim()||null, series_id:series}));
    $('#ok').disabled=true;
    const { data, error } = await sb.from('healings').insert(rows).select();
    if(error){ $('#ok').disabled=false; return fail(error); }
    S.healings.push(...data); S.healings.sort((a,b)=>(a.healing_date+(a.healing_time||'')).localeCompare(b.healing_date+(b.healing_time||'')));
    closeModal(); toast(`${data.length} healing${data.length>1?'s':''} scheduled`); refresh();
  };
}

/* ---- Edit a single healing ---- */
function editHealingModal(id){
  const h=S.healings.find(x=>x.id===id); const p=pById(h.patient_id);
  const seriesLeft = h.series_id ? S.healings.filter(x=>x.series_id===h.series_id && x.status==='Pending' && x.healing_date>=h.healing_date).length : 0;
  openModal(`Healing · ${esc(p.full_name)}`, `
    <div class="g3"><div class="fld"><label for="e_d">Date</label><input type="date" id="e_d" value="${h.healing_date}"></div>
      <div class="fld"><label for="e_t">Time</label><input type="time" id="e_t" value="${h.healing_time?h.healing_time.slice(0,5):''}"></div>
      <div class="fld"><label for="e_s">Status</label><select id="e_s">${opts(HSTATUS,h.status)}</select></div></div>
    <div class="fld"><label for="e_n">Notes</label><textarea id="e_n">${esc(h.notes||'')}</textarea></div>
    ${seriesLeft>1?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="e_all"> Apply the time to all ${seriesLeft} pending sessions in this series from this date</label>`:''}`,
    `<button class="btn-danger" id="e_del" style="margin-right:auto">Delete</button><button class="btn btn-o" value="cancel">Cancel</button><button class="btn btn-p" id="ok" value="">Save</button>`);
  $('#ok').onclick=async ev=>{
    ev.preventDefault();
    const patch={healing_date:$('#e_d').value, healing_time:$('#e_t').value||null, status:$('#e_s').value, notes:$('#e_n').value.trim()||null};
    let { error } = await sb.from('healings').update(patch).eq('id',id); if(error) return fail(error);
    Object.assign(h,patch);
    if($('#e_all')?.checked){
      const r = await sb.from('healings').update({healing_time:patch.healing_time}).eq('series_id',h.series_id).eq('status','Pending').gte('healing_date',h.healing_date);
      if(r.error) return fail(r.error);
      S.healings.forEach(x=>{ if(x.series_id===h.series_id && x.status==='Pending' && x.healing_date>=h.healing_date) x.healing_time=patch.healing_time; });
    }
    closeModal(); toast('Healing saved'); refresh();
  };
  $('#e_del').onclick=async ev=>{ ev.preventDefault(); if(!confirm('Delete this healing session?')) return;
    const { error } = await sb.from('healings').delete().eq('id',id); if(error) return fail(error);
    S.healings=S.healings.filter(x=>x.id!==id); closeModal(); toast('Healing deleted'); refresh(); };
}

/* ---- Scan form ---- */
function levelCtl(name, cls, list, val, obs, ph){
  return `<div><select class="${cls}" aria-label="${ph} for ${name}">${opts(list,val,ph)}</select>
    <input type="text" class="obs ${cls}-o" placeholder="Observation (optional)" value="${esc(obs||'')}" aria-label="${ph} observation for ${name}"></div>`;
}
const minorRow = (m={}) => `<div class="dyn dyn-minor mrow"><input type="text" class="m-n" placeholder="Minor chakra" value="${esc(m.name||'')}">
  ${levelCtl('minor chakra','m-e',ENERGY,m.energy,m.energy_obs,'Energy level')}${levelCtl('minor chakra','m-a',ACTIV,m.activation,m.activation_obs,'Activation level')}<button type="button" class="btn-danger rm">Remove</button></div>`;
const organRow = (o={}) => `<div class="dyn dyn-organ orow"><input type="text" class="o-n" placeholder="Organ" value="${esc(o.name||'')}">
  <select class="o-e" aria-label="Organ energy level">${opts(ENERGY,o.energy,'Energy level')}</select><input type="text" class="o-o" placeholder="Observation" value="${esc(o.obs||'')}"><button type="button" class="btn-danger rm">Remove</button></div>`;
const emoRow = (em={}) => `<div class="dyn dyn-emo erow"><input type="text" class="em-n" placeholder="Emotion" value="${esc(em.name||'')}"><input type="text" class="em-o" placeholder="Observation" value="${esc(em.obs||'')}"><button type="button" class="btn-danger rm">Remove</button></div>`;

function scanModal(p, sc){
  const s = sc||{major_chakras:{},minor_chakras:[],organs:[],emotions:[]};
  openModal(sc?'Edit scan':'New scan · '+esc(p.full_name), `
    <div class="g3"><div class="fld"><label for="sc_d">Scan date</label><input type="date" id="sc_d" value="${s.scan_date||todayISO()}"></div></div>
    <div class="g2">
      <div class="fld"><label for="sc_a">Average aura</label><div style="display:flex;gap:8px"><input type="number" step="0.1" id="sc_a" value="${s.avg_aura??''}"><select id="sc_au" style="width:auto">${opts(UNITS,s.aura_unit||'Inches')}</select></div></div>
      <div class="fld"><label for="sc_ac">Average activation</label><div style="display:flex;gap:8px"><input type="number" step="0.1" id="sc_ac" value="${s.avg_activation??''}"><select id="sc_acu" style="width:auto">${opts(UNITS,s.activation_unit||'Inches')}</select></div></div>
    </div>
    <div class="sec-t">Major chakras</div>
    <p style="margin:-4px 0 10px;color:var(--muted);font-size:.88rem">Leave a chakra blank if you didn't scan it. <button type="button" class="link" id="allnorm">Set all blanks to Normal</button></p>
    ${MAJOR.map(c=>{const v=s.major_chakras[c]||{}; return `<div class="chak" data-c="${c}"><b>${c}</b>${levelCtl(c,'c-e',ENERGY,v.energy,v.energy_obs,'Energy level')}${levelCtl(c,'c-a',ACTIV,v.activation,v.activation_obs,'Activation level')}</div>`;}).join('')}
    <div class="sec-t">Minor chakras</div><div id="sc_min">${(s.minor_chakras||[]).map(minorRow).join('')}</div><button type="button" class="add" data-add="min">+ Add minor chakra</button>
    <div class="sec-t">Internal organs</div><div id="sc_org">${(s.organs||[]).map(organRow).join('')}</div><button type="button" class="add" data-add="org">+ Add organ</button>
    <div class="sec-t">Emotions</div><div id="sc_emo">${(s.emotions||[]).map(emoRow).join('')}</div><button type="button" class="add" data-add="emo">+ Add emotion</button>
    <div class="sec-t">Notes</div><textarea id="sc_n">${esc(s.notes||'')}</textarea>`,
    `${sc?'<button class="btn-danger" id="sc_del" style="margin-right:auto">Delete scan</button>':''}<button class="btn btn-o" value="cancel">Cancel</button><button class="btn btn-p" id="ok" value="">${sc?'Save scan':'Create scan'}</button>`);
  const wire=()=>$$('#mbody .rm').forEach(b=>b.onclick=()=>b.closest('.dyn').remove());
  wire();
  $$('[data-add]').forEach(b=>b.onclick=()=>{ const k=b.dataset.add; $('#sc_'+k).insertAdjacentHTML('beforeend',{min:minorRow,org:organRow,emo:emoRow}[k]()); wire(); $('#sc_'+k).lastElementChild.querySelector('input').focus(); });
  $('#allnorm').onclick=()=>$$('.chak').forEach(r=>{ const e=$('select.c-e',r), a=$('select.c-a',r); if(!e.value) e.value='Normal'; if(!a.value) a.value='Normal'; });
  $('#ok').onclick=async ev=>{
    ev.preventDefault();
    const major={}; $$('.chak').forEach(r=>{ const o={energy:$('select.c-e',r).value, energy_obs:$('.c-e-o',r).value.trim(), activation:$('select.c-a',r).value, activation_obs:$('.c-a-o',r).value.trim()};
      if(o.energy||o.activation||o.energy_obs||o.activation_obs) major[r.dataset.c]=o; });
    const num=v=>v===''?null:+v;
    const row={ patient_id:p.id, scan_date:$('#sc_d').value||todayISO(), avg_aura:num($('#sc_a').value), aura_unit:$('#sc_au').value, avg_activation:num($('#sc_ac').value), activation_unit:$('#sc_acu').value,
      major_chakras:major,
      minor_chakras:$$('.mrow').map(r=>({name:$('.m-n',r).value.trim(),energy:$('select.m-e',r).value,energy_obs:$('.m-e-o',r).value.trim(),activation:$('select.m-a',r).value,activation_obs:$('.m-a-o',r).value.trim()})).filter(x=>x.name),
      organs:$$('.orow').map(r=>({name:$('.o-n',r).value.trim(),energy:$('.o-e',r).value,obs:$('.o-o',r).value.trim()})).filter(x=>x.name),
      emotions:$$('.erow').map(r=>({name:$('.em-n',r).value.trim(),obs:$('.em-o',r).value.trim()})).filter(x=>x.name),
      notes:$('#sc_n').value.trim()||null };
    $('#ok').disabled=true;
    const res = sc ? await sb.from('scans').update(row).eq('id',sc.id).select().single() : await sb.from('scans').insert(row).select().single();
    if(res.error){ $('#ok').disabled=false; return fail(res.error); }
    if(sc) Object.assign(sc,res.data); else p._scans.unshift(res.data);
    p._scans.sort((a,b)=>b.scan_date.localeCompare(a.scan_date));
    closeModal(); toast(sc?'Scan saved':'Scan created'); S.tab='scans'; renderPatient();
  };
  if(sc) $('#sc_del').onclick=async ev=>{ ev.preventDefault(); if(!confirm('Delete this scan?')) return;
    const { error } = await sb.from('scans').delete().eq('id',sc.id); if(error) return fail(error);
    p._scans=p._scans.filter(x=>x.id!==sc.id); closeModal(); toast('Scan deleted'); renderPatient(); };
}
function scanView(p, sc){
  const pill=(v,pre)=>v?`<span class="pill ${pre}-${v.split(' ')[0]}">${esc(v)}</span>`:'';
  const major=MAJOR.filter(c=>sc.major_chakras?.[c]).map(c=>{const v=sc.major_chakras[c]; return `<div class="view-block"><b>${c}</b> ${pill(v.energy,'e')} ${pill(v.activation,'a')}
    ${v.energy_obs?`<div><small>Energy:</small> ${esc(v.energy_obs)}</div>`:''}${v.activation_obs?`<div><small>Activation:</small> ${esc(v.activation_obs)}</div>`:''}</div>`;}).join('');
  const list=(arr,f)=>arr&&arr.length?arr.map(f).join(''):'<p style="color:var(--muted)">None recorded.</p>';
  openModal(`Scan · ${fmtDate(sc.scan_date)}`, `
    <p><b>Average aura:</b> ${sc.avg_aura??'—'} ${sc.avg_aura!=null?esc(sc.aura_unit):''} &nbsp; <b>Average activation:</b> ${sc.avg_activation??'—'} ${sc.avg_activation!=null?esc(sc.activation_unit):''}</p>
    <div class="sec-t">Major chakras</div>${major||'<p style="color:var(--muted)">None recorded.</p>'}
    <div class="sec-t">Minor chakras</div>${list(sc.minor_chakras,m=>`<div class="view-block"><b>${esc(m.name)}</b> ${pill(m.energy,'e')} ${pill(m.activation,'a')} ${m.energy_obs?`<div><small>Energy:</small> ${esc(m.energy_obs)}</div>`:''}${m.activation_obs?`<div><small>Activation:</small> ${esc(m.activation_obs)}</div>`:''}</div>`)}
    <div class="sec-t">Internal organs</div>${list(sc.organs,o=>`<div class="view-block"><b>${esc(o.name)}</b> ${pill(o.energy,'e')} ${o.obs?`<div>${esc(o.obs)}</div>`:''}</div>`)}
    <div class="sec-t">Emotions</div>${list(sc.emotions,e=>`<div class="view-block"><b>${esc(e.name)}</b>${e.obs?` — ${esc(e.obs)}`:''}</div>`)}
    ${sc.notes?`<div class="sec-t">Notes</div><div class="view-block" style="white-space:pre-wrap">${esc(sc.notes)}</div>`:''}`,
    `<button class="btn btn-o" value="cancel">Close</button><button class="btn btn-p" id="ok" value="">Edit scan</button>`);
  $('#ok').onclick=ev=>{ ev.preventDefault(); scanModal(p,sc); };
}

boot();
</script>
